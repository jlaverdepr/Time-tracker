kind = "web"
previewPath = "/date-app/"
title = "Wanna Go On A Date?"
version = "1.0.0"
id = "artifacts/date-app"
router = "path"

[[services]]
name = "web"
paths = [ "/date-app/" ]
localPort = 21844

[services.development]
run = "pnpm --filter @workspace/date-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/date-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/date-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21844"
BASE_PATH = "/date-app/"
