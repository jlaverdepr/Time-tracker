openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Work Time Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: subprojects
    description: Subproject operations
  - name: sessions
    description: Work session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects/{id}/complete:
    post:
      operationId: completeProject
      tags: [projects]
      summary: Mark a project as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found

  /projects/{id}/reopen:
    post:
      operationId: reopenProject
      tags: [projects]
      summary: Reopen a completed project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found

  /subprojects:
    get:
      operationId: listSubprojects
      tags: [subprojects]
      summary: List subprojects, optionally filtered by project
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
          description: "Filter by parent project"
      responses:
        "200":
          description: List of subprojects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subproject"
    post:
      operationId: createSubproject
      tags: [subprojects]
      summary: Create a subproject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubprojectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"

  /subprojects/calendar-events:
    get:
      operationId: getSubprojectCalendarEvents
      tags: [subprojects]
      summary: Get per-day subproject activity and completion events for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: "Start of range (YYYY-MM-DD)"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: "End of range (YYYY-MM-DD)"
      responses:
        "200":
          description: Array of subproject calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubprojectCalendarEvent"

  /subprojects/{id}:
    patch:
      operationId: updateSubproject
      tags: [subprojects]
      summary: Update a subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubprojectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found
    delete:
      operationId: deleteSubproject
      tags: [subprojects]
      summary: Delete a subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /subprojects/{id}/complete:
    post:
      operationId: completeSubproject
      tags: [subprojects]
      summary: Mark a subproject as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subproject marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found

  /subprojects/{id}/reopen:
    post:
      operationId: reopenSubproject
      tags: [subprojects]
      summary: Reopen a completed subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subproject reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions, optionally filtered by date range
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
          description: "Filter sessions on or after this date (YYYY-MM-DD)"
        - name: endDate
          in: query
          schema:
            type: string
          description: "Filter sessions on or before this date (YYYY-MM-DD)"
        - name: projectId
          in: query
          schema:
            type: integer
          description: "Filter by project"
        - name: subprojectId
          in: query
          schema:
            type: integer
          description: "Filter by subproject"
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a work session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a work session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a work session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sessions/calendar:
    get:
      operationId: getCalendar
      tags: [sessions]
      summary: Get per-day work totals for a date range (calendar view)
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: "Start of range (YYYY-MM-DD)"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: "End of range (YYYY-MM-DD)"
      responses:
        "200":
          description: Array of daily summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaySummary"

  /sessions/stats:
    get:
      operationId: getStats
      tags: [sessions]
      summary: Get aggregate stats (today, this week, this month, all-time)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /sessions/recent:
    get:
      operationId: getRecentSessions
      tags: [sessions]
      summary: Get the most recent sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: "Max number of sessions to return (default 10)"
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      required: [id, name, color, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          description: "Hex color e.g. #3B82F6"
        status:
          type: string
          description: "'active' or 'completed'"
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    Subproject:
      type: object
      required: [id, projectId, name, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
          description: "Hex color; null means inherit from parent project"
        status:
          type: string
          description: "'active' or 'completed'"
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    SubprojectInput:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: integer
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]

    SubprojectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]

    SubprojectCalendarEvent:
      type: object
      required: [date, subprojectId, subprojectName, projectId, projectName, projectColor, eventType]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        subprojectId:
          type: integer
        subprojectName:
          type: string
        subprojectColor:
          type: ["string", "null"]
        projectId:
          type: integer
        projectName:
          type: string
        projectColor:
          type: string
        eventType:
          type: string
          description: "'active' (had sessions) or 'completed' (completion date)"

    Session:
      type: object
      required: [id, date, durationMinutes, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        projectColor:
          type: ["string", "null"]
        subprojectId:
          type: ["integer", "null"]
        subprojectName:
          type: ["string", "null"]
        date:
          type: string
          description: "YYYY-MM-DD"
        startTime:
          type: ["string", "null"]
          description: "HH:MM (24h)"
        endTime:
          type: ["string", "null"]
          description: "HH:MM (24h)"
        durationMinutes:
          type: integer
          description: "Duration in minutes"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    SessionInput:
      type: object
      required: [date, durationMinutes]
      properties:
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        date:
          type: string
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        durationMinutes:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]

    SessionUpdate:
      type: object
      properties:
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        date:
          type: string
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        durationMinutes:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]

    DaySummary:
      type: object
      required: [date, totalMinutes, sessionCount]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        totalMinutes:
          type: integer
        sessionCount:
          type: integer
        projectBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMinutes"

    ProjectMinutes:
      type: object
      required: [projectId, projectName, projectColor, minutes]
      properties:
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        projectColor:
          type: ["string", "null"]
        minutes:
          type: integer

    Stats:
      type: object
      required: [todayMinutes, weekMinutes, monthMinutes, allTimeMinutes, todaySessions, weekSessions, monthSessions, allTimeSessions]
      properties:
        todayMinutes:
          type: integer
        weekMinutes:
          type: integer
        monthMinutes:
          type: integer
        allTimeMinutes:
          type: integer
        todaySessions:
          type: integer
        weekSessions:
          type: integer
        monthSessions:
          type: integer
        allTimeSessions:
          type: integer
