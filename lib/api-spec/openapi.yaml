openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Work Time Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: subprojects
    description: Subproject operations
  - name: sessions
    description: Work session operations
  - name: todos
    description: To-do list operations
  - name: gym
    description: Gym tracking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects/{id}/complete:
    post:
      operationId: completeProject
      tags: [projects]
      summary: Mark a project as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found

  /projects/{id}/reopen:
    post:
      operationId: reopenProject
      tags: [projects]
      summary: Reopen a completed project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found

  /subprojects:
    get:
      operationId: listSubprojects
      tags: [subprojects]
      summary: List subprojects, optionally filtered by project
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
          description: "Filter by parent project"
      responses:
        "200":
          description: List of subprojects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subproject"
    post:
      operationId: createSubproject
      tags: [subprojects]
      summary: Create a subproject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubprojectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"

  /subprojects/calendar-events:
    get:
      operationId: getSubprojectCalendarEvents
      tags: [subprojects]
      summary: Get per-day subproject activity and completion events for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: "Start of range (YYYY-MM-DD)"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: "End of range (YYYY-MM-DD)"
      responses:
        "200":
          description: Array of subproject calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubprojectCalendarEvent"

  /subprojects/{id}:
    patch:
      operationId: updateSubproject
      tags: [subprojects]
      summary: Update a subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubprojectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found
    delete:
      operationId: deleteSubproject
      tags: [subprojects]
      summary: Delete a subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /subprojects/{id}/complete:
    post:
      operationId: completeSubproject
      tags: [subprojects]
      summary: Mark a subproject as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subproject marked completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found

  /subprojects/{id}/reopen:
    post:
      operationId: reopenSubproject
      tags: [subprojects]
      summary: Reopen a completed subproject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subproject reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subproject"
        "404":
          description: Not found

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions, optionally filtered by date range
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
          description: "Filter sessions on or after this date (YYYY-MM-DD)"
        - name: endDate
          in: query
          schema:
            type: string
          description: "Filter sessions on or before this date (YYYY-MM-DD)"
        - name: projectId
          in: query
          schema:
            type: integer
          description: "Filter by project"
        - name: subprojectId
          in: query
          schema:
            type: integer
          description: "Filter by subproject"
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a work session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a work session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a work session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sessions/calendar:
    get:
      operationId: getCalendar
      tags: [sessions]
      summary: Get per-day work totals for a date range (calendar view)
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: "Start of range (YYYY-MM-DD)"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: "End of range (YYYY-MM-DD)"
      responses:
        "200":
          description: Array of daily summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaySummary"

  /sessions/stats:
    get:
      operationId: getStats
      tags: [sessions]
      summary: Get aggregate stats (today, this week, this month, all-time)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /sessions/recent:
    get:
      operationId: getRecentSessions
      tags: [sessions]
      summary: Get the most recent sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: "Max number of sessions to return (default 10)"
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /todo-lists:
    get:
      operationId: listTodoLists
      tags: [todos]
      summary: List all to-do lists
      responses:
        "200":
          description: List of todo lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoList"
    post:
      operationId: createTodoList
      tags: [todos]
      summary: Create a to-do list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"

  /todo-lists/{id}:
    patch:
      operationId: updateTodoList
      tags: [todos]
      summary: Update a to-do list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoListUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        "404":
          description: Not found
    delete:
      operationId: deleteTodoList
      tags: [todos]
      summary: Delete a to-do list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /todo-lists/{id}/clear-completed:
    post:
      operationId: clearCompletedTodoTasks
      tags: [todos]
      summary: Soft-clear (hide) all currently-completed tasks in a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                required: [clearedCount]
                properties:
                  clearedCount:
                    type: integer

  /todo-tasks:
    get:
      operationId: listTodoTasks
      tags: [todos]
      summary: List tasks, optionally filtered by list
      parameters:
        - name: listId
          in: query
          schema:
            type: integer
          description: "Filter by list"
        - name: projectId
          in: query
          schema:
            type: integer
          description: "Filter by project"
        - name: includeCleared
          in: query
          schema:
            type: boolean
          description: "Include soft-cleared tasks (default false)"
        - name: includeFuture
          in: query
          schema:
            type: boolean
          description: "Include tasks scheduled for a future date (default false)"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoTask"
    post:
      operationId: createTodoTask
      tags: [todos]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoTask"

  /todo-tasks/calendar-summary:
    get:
      operationId: getTodoCalendarSummary
      tags: [todos]
      summary: Per-day completion rates for all lists in a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD"
      responses:
        "200":
          description: Array of daily list summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoCalendarSummaryItem"

  /todo-tasks/day-detail:
    get:
      operationId: getTodoDayDetail
      tags: [todos]
      summary: Reconstructed task list + completion state for a list on a specific date
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD"
      responses:
        "200":
          description: Tasks as they stood on that date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodoDayDetailTask"

  /todo-tasks/day-detail/toggle:
    post:
      operationId: toggleTodoDayDetailTask
      tags: [todos]
      summary: Toggle a task's completion for a specific (typically past) date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoDayDetailToggleInput"
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoDayDetailTask"

  /todo-tasks/{id}:
    patch:
      operationId: updateTodoTask
      tags: [todos]
      summary: Update a task's text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoTaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoTask"
        "404":
          description: Not found
    delete:
      operationId: deleteTodoTask
      tags: [todos]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /todo-tasks/{id}/complete:
    post:
      operationId: completeTodoTask
      tags: [todos]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoTask"
        "404":
          description: Not found

  /todo-tasks/{id}/uncomplete:
    post:
      operationId: uncompleteTodoTask
      tags: [todos]
      summary: Mark a task as incomplete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task uncompleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoTask"
        "404":
          description: Not found

  /gym-exercises:
    get:
      operationId: listGymExercises
      tags: [gym]
      summary: List all exercises
      responses:
        "200":
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymExercise"
    post:
      operationId: createGymExercise
      tags: [gym]
      summary: Create an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymExerciseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymExercise"

  /gym-exercises/{id}:
    patch:
      operationId: updateGymExercise
      tags: [gym]
      summary: Update an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymExerciseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymExercise"
        "404":
          description: Not found
    delete:
      operationId: deleteGymExercise
      tags: [gym]
      summary: Delete an exercise
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-workouts:
    get:
      operationId: listGymWorkouts
      tags: [gym]
      summary: List all workouts
      responses:
        "200":
          description: List of workouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymWorkout"
    post:
      operationId: createGymWorkout
      tags: [gym]
      summary: Create a workout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkout"

  /gym-workouts/{id}:
    patch:
      operationId: updateGymWorkout
      tags: [gym]
      summary: Update a workout's title and/or date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkout"
        "404":
          description: Not found
    delete:
      operationId: deleteGymWorkout
      tags: [gym]
      summary: Delete a workout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-workout-entries:
    get:
      operationId: listGymWorkoutEntries
      tags: [gym]
      summary: List workout entries, optionally filtered by workout
      parameters:
        - name: workoutId
          in: query
          schema:
            type: integer
          description: "Filter by workout"
      responses:
        "200":
          description: List of workout entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymWorkoutEntry"
    post:
      operationId: createGymWorkoutEntry
      tags: [gym]
      summary: Add an exercise entry to a workout (seeds one empty main set)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkoutEntry"

  /gym-workout-entries/{id}:
    delete:
      operationId: deleteGymWorkoutEntry
      tags: [gym]
      summary: Delete a workout entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-workout-sets:
    get:
      operationId: listGymWorkoutSets
      tags: [gym]
      summary: List sets, optionally filtered by entry
      parameters:
        - name: entryId
          in: query
          schema:
            type: integer
          description: "Filter by workout entry"
      responses:
        "200":
          description: List of sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymWorkoutSet"
    post:
      operationId: createGymWorkoutSet
      tags: [gym]
      summary: Add a set (main or warmup) to an entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutSetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkoutSet"

  /gym-workout-sets/{id}:
    patch:
      operationId: updateGymWorkoutSet
      tags: [gym]
      summary: Update a set's reps, weight, or failure flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutSetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkoutSet"
        "404":
          description: Not found
    delete:
      operationId: deleteGymWorkoutSet
      tags: [gym]
      summary: Delete a set
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-runs:
    get:
      operationId: listGymRuns
      tags: [gym]
      summary: List all runs
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymRun"
    post:
      operationId: createGymRun
      tags: [gym]
      summary: Log a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymRun"

  /gym-runs/{id}:
    patch:
      operationId: updateGymRun
      tags: [gym]
      summary: Update a run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymRunUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymRun"
        "404":
          description: Not found
    delete:
      operationId: deleteGymRun
      tags: [gym]
      summary: Delete a run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-body-weight-logs:
    get:
      operationId: listGymBodyWeightLogs
      tags: [gym]
      summary: List all body weight logs
      responses:
        "200":
          description: List of body weight logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymBodyWeightLog"
    post:
      operationId: createGymBodyWeightLog
      tags: [gym]
      summary: Log a body weight entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymBodyWeightLogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymBodyWeightLog"

  /gym-body-weight-logs/{id}:
    patch:
      operationId: updateGymBodyWeightLog
      tags: [gym]
      summary: Update a body weight log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymBodyWeightLogUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymBodyWeightLog"
        "404":
          description: Not found
    delete:
      operationId: deleteGymBodyWeightLog
      tags: [gym]
      summary: Delete a body weight log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /gym-workout-templates:
    get:
      operationId: listGymWorkoutTemplates
      tags: [gym]
      summary: List all workout templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymWorkoutTemplate"
    post:
      operationId: createGymWorkoutTemplate
      tags: [gym]
      summary: Save a set of exercises as a reusable template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GymWorkoutTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymWorkoutTemplate"

  /gym-workout-templates/{id}:
    delete:
      operationId: deleteGymWorkoutTemplate
      tags: [gym]
      summary: Delete a workout template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      required: [id, name, color, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          description: "Hex color e.g. #3B82F6"
        status:
          type: string
          description: "'active' or 'completed'"
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string

    Subproject:
      type: object
      required: [id, projectId, name, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
          description: "Hex color; null means inherit from parent project"
        status:
          type: string
          description: "'active' or 'completed'"
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    SubprojectInput:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: integer
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]

    SubprojectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]

    SubprojectCalendarEvent:
      type: object
      required: [date, subprojectId, subprojectName, projectId, projectName, projectColor, eventType]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        subprojectId:
          type: integer
        subprojectName:
          type: string
        subprojectColor:
          type: ["string", "null"]
        projectId:
          type: integer
        projectName:
          type: string
        projectColor:
          type: string
        eventType:
          type: string
          description: "'active' (had sessions) or 'completed' (completion date)"

    Session:
      type: object
      required: [id, date, durationMinutes, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        projectColor:
          type: ["string", "null"]
        subprojectId:
          type: ["integer", "null"]
        subprojectName:
          type: ["string", "null"]
        date:
          type: string
          description: "YYYY-MM-DD"
        startTime:
          type: ["string", "null"]
          description: "HH:MM (24h)"
        endTime:
          type: ["string", "null"]
          description: "HH:MM (24h)"
        durationMinutes:
          type: integer
          description: "Duration in minutes"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    SessionInput:
      type: object
      required: [date, durationMinutes]
      properties:
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        date:
          type: string
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        durationMinutes:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]

    SessionUpdate:
      type: object
      properties:
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        date:
          type: string
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        durationMinutes:
          type: integer
          minimum: 1
        notes:
          type: ["string", "null"]

    DaySummary:
      type: object
      required: [date, totalMinutes, sessionCount]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        totalMinutes:
          type: integer
        sessionCount:
          type: integer
        projectBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMinutes"

    ProjectMinutes:
      type: object
      required: [projectId, projectName, projectColor, minutes]
      properties:
        projectId:
          type: ["integer", "null"]
        projectName:
          type: ["string", "null"]
        projectColor:
          type: ["string", "null"]
        minutes:
          type: integer

    Stats:
      type: object
      required: [todayMinutes, weekMinutes, monthMinutes, allTimeMinutes, todaySessions, weekSessions, monthSessions, allTimeSessions]
      properties:
        todayMinutes:
          type: integer
        weekMinutes:
          type: integer
        monthMinutes:
          type: integer
        allTimeMinutes:
          type: integer
        todaySessions:
          type: integer
        weekSessions:
          type: integer
        monthSessions:
          type: integer
        allTimeSessions:
          type: integer

    TodoList:
      type: object
      required: [id, name, color, letter, resetDaily, autoClearCompleted, sortOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        letter:
          type: string
          description: "Single uppercase character shown in badges"
        resetDaily:
          type: boolean
        autoClearCompleted:
          type: boolean
          description: "If true, completed tasks are hidden (soft-cleared) once the day ends"
        sortOrder:
          type: integer
        createdAt:
          type: string

    TodoListInput:
      type: object
      required: [name, color, letter]
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
        letter:
          type: string
          minLength: 1
          maxLength: 1
        resetDaily:
          type: boolean
        autoClearCompleted:
          type: boolean
        sortOrder:
          type: integer

    TodoListUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
        letter:
          type: string
          minLength: 1
          maxLength: 1
        resetDaily:
          type: boolean
        autoClearCompleted:
          type: boolean
        sortOrder:
          type: integer

    TodoTask:
      type: object
      required: [id, listId, text, sortOrder, createdAt]
      properties:
        id:
          type: integer
        listId:
          type: integer
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        text:
          type: string
        completedAt:
          type: ["string", "null"]
        completedDate:
          type: ["string", "null"]
          description: "YYYY-MM-DD of completion; used for daily-reset logic"
        clearedAt:
          type: ["string", "null"]
          description: "Soft-hide timestamp; cleared tasks no longer show on the live list"
        scheduledDate:
          type: ["string", "null"]
          description: "YYYY-MM-DD; if set and in the future, task is 'prepared' and hidden until then"
        reminderTime:
          type: ["string", "null"]
          description: "HH:mm; opt-in reminder time of day"
        sortOrder:
          type: integer
        createdAt:
          type: string

    TodoTaskInput:
      type: object
      required: [listId, text]
      properties:
        listId:
          type: integer
        text:
          type: string
          minLength: 1
        projectId:
          type: integer
        subprojectId:
          type: integer
        scheduledDate:
          type: string
          description: "YYYY-MM-DD"
        reminderTime:
          type: string
          description: "HH:mm"

    TodoTaskUpdate:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        projectId:
          type: ["integer", "null"]
        subprojectId:
          type: ["integer", "null"]
        scheduledDate:
          type: ["string", "null"]
        reminderTime:
          type: ["string", "null"]
        listId:
          type: integer
          description: "Move the task to a different list"
        sortOrder:
          type: integer

    TodoCalendarSummaryItem:
      type: object
      required: [date, listId, listName, listColor, letter, totalTasks, completedTasks, preparedTasks, percentage]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        listId:
          type: integer
        listName:
          type: string
        listColor:
          type: string
        letter:
          type: string
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        preparedTasks:
          type: integer
          description: "Count of tasks scheduled (prepared in advance) for this date"
        percentage:
          type: integer
          description: "0-100"

    TodoDayDetailTask:
      type: object
      required: [taskId, text, completed]
      properties:
        taskId:
          type: integer
        text:
          type: string
        completed:
          type: boolean

    TodoDayDetailToggleInput:
      type: object
      required: [taskId, date, completed]
      properties:
        taskId:
          type: integer
        date:
          type: string
          description: "YYYY-MM-DD"
        completed:
          type: boolean

    GymExerciseCategory:
      type: string
      enum: ["Upper Body", "Lower Body", "Full Body", "Core", "Minor"]

    GymExercise:
      type: object
      required: [id, name, category, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: "#/components/schemas/GymExerciseCategory"
        createdAt:
          type: string

    GymExerciseInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/GymExerciseCategory"

    GymExerciseUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/GymExerciseCategory"

    GymWorkout:
      type: object
      required: [id, date, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          description: "YYYY-MM-DD"
        title:
          type: ["string", "null"]
          description: "'Chest' | 'Legs' | 'Back' | free text from 'Other'"
        createdAt:
          type: string

    GymWorkoutInput:
      type: object
      properties:
        date:
          type: string
          description: "YYYY-MM-DD; defaults to today if omitted"
        title:
          type: string

    GymWorkoutUpdate:
      type: object
      properties:
        title:
          type: ["string", "null"]
        date:
          type: string
          description: "YYYY-MM-DD"

    GymWorkoutEntry:
      type: object
      required: [id, workoutId, exerciseId, sortOrder, createdAt]
      properties:
        id:
          type: integer
        workoutId:
          type: integer
        exerciseId:
          type: integer
        sortOrder:
          type: integer
        createdAt:
          type: string

    GymWorkoutEntryInput:
      type: object
      required: [workoutId, exerciseId]
      properties:
        workoutId:
          type: integer
        exerciseId:
          type: integer
        sortOrder:
          type: integer

    GymWorkoutSet:
      type: object
      required: [id, entryId, isWarmup, setIndex, failure, createdAt]
      properties:
        id:
          type: integer
        entryId:
          type: integer
        isWarmup:
          type: boolean
        setIndex:
          type: integer
          description: "1-5, position within its group (main or warmup)"
        reps:
          type: ["integer", "null"]
        weight:
          type: ["number", "null"]
        failure:
          type: boolean
        createdAt:
          type: string

    GymWorkoutSetInput:
      type: object
      required: [entryId, isWarmup, setIndex]
      properties:
        entryId:
          type: integer
        isWarmup:
          type: boolean
        setIndex:
          type: integer
        reps:
          type: integer
        weight:
          type: number

    GymWorkoutSetUpdate:
      type: object
      properties:
        reps:
          type: ["integer", "null"]
        weight:
          type: ["number", "null"]
        failure:
          type: boolean

    GymRun:
      type: object
      required: [id, date, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          description: "YYYY-MM-DD"
        distanceKm:
          type: ["number", "null"]
        durationSeconds:
          type: ["integer", "null"]
          description: "Total run time in seconds"
        createdAt:
          type: string

    GymRunInput:
      type: object
      properties:
        date:
          type: string
          description: "YYYY-MM-DD; defaults to today if omitted"
        distanceKm:
          type: number
        durationSeconds:
          type: integer
          minimum: 0

    GymRunUpdate:
      type: object
      properties:
        date:
          type: string
        distanceKm:
          type: ["number", "null"]
        durationSeconds:
          type: ["integer", "null"]
          minimum: 0

    GymBodyWeightLog:
      type: object
      required: [id, date, weightKg, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          description: "YYYY-MM-DD"
        weightKg:
          type: number
        createdAt:
          type: string

    GymBodyWeightLogInput:
      type: object
      required: [date, weightKg]
      properties:
        date:
          type: string
          description: "YYYY-MM-DD"
        weightKg:
          type: number

    GymBodyWeightLogUpdate:
      type: object
      properties:
        date:
          type: string
        weightKg:
          type: number

    GymWorkoutTemplate:
      type: object
      required: [id, name, exerciseIds, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        exerciseIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string

    GymWorkoutTemplateInput:
      type: object
      required: [name, exerciseIds]
      properties:
        name:
          type: string
          minLength: 1
        exerciseIds:
          type: array
          items:
            type: integer
